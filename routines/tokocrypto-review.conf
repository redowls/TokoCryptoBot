# TokoCryptoBot 4-hourly self-review.
#
# This routine REPORTS, it does not change the bot. The run-routine.sh defaults
# (ALLOWED_TOOLS="Bash Read Grep Glob", DISALLOWED_TOOLS="Write Edit ...") are
# deliberately NOT widened here: with no Write or Edit tool the routine is
# structurally incapable of widening a stop, loosening a filter, or flipping
# TRADING_ENABLED, which is the exact failure mode a repeatedly-failing
# backtest invites. Prose in the prompt asks for restraint; missing tools
# guarantee it.
#
# Skill and Agent are disallowed on top of the defaults — a headless run that
# trips the Skill tool burns the whole timeout doing nothing (the USNateTradeBot
# misfire).
#
# Opus 5, by the user's decision (2026-09-19), replacing the sonnet this shipped
# with. The reading it has to do is not mechanical: a bot that has failed its
# gate twice invites a report that quietly rounds a bad number towards progress,
# and judging "is this rejection pattern the strategy working or one filter
# eating everything?" is the part worth the better model.
#
# Timeout raised 420 -> 900 to match cryptoindodax-daily, the other opus
# routine. Opus runs longer than sonnet and a routine killed mid-run sends a
# TIMED OUT alert instead of a report, which reads like a bot failure.
TIMEOUT_SECS=900
MODEL="claude-opus-5"
DISALLOWED_TOOLS="Write Edit NotebookEdit Skill Agent"

# Telegram creds come from the bot's own .env rather than being copied here, so
# the token lives in exactly one place and rotating it does not silently leave
# a stale duplicate in claude-routines.
set -a
# shellcheck disable=SC1091
. /root/TokoCryptoBot/.env
set +a
